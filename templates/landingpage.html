<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../source/css/global.css">
    <link rel="stylesheet" href="../source/css/landingpage.css">
    <title>Bienvenido</title>
</head>

<body>

    <header class="topbar">
        <div class="logo-container">
            <img src="../source/img/logo-formatic.png" alt="Logo FormaTIC" class="logo-img">
            <span class="logo-text">Forma<span class="logo-highlight">TIC</span></span>
        </div>
    </header>

    <main class="hero-container">
        <!-- Columna Izquierda: Texto y Botón -->
        <div class="hero-content">
            <h1 class="hero-title">
                Gestión y seguimiento a <span class="highlight-verde">Proyectos Formativos</span>
            </h1>
            <p class="hero-description">
                Conectamos instructores y aprendices en una sola plataforma para optimizar el desarrollo, revisiones y
                entregables de cada formación.
            </p>
            <div class="hero-actions">
                <a href="#" class="btn-primary">Empezar ahora</a>
                <!-- Opcional: Un botón secundario -->
                <a href="#" class="btn-secondary">Saber más</a>
            </div>
        </div>

        <!-- Columna Derecha: Imagen / Ilustración ilustrativa -->
        <div class="hero-image">
            <img src="../source/img/Dashboard-bro.png" alt="FormaTIC Dashboard Ilustración">

</body>
